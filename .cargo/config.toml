# Use Apple's libclang for bindgen (coreaudio-sys).
# Homebrew LLVM's libclang may have broken dylib paths.
[env]
LIBCLANG_PATH = "/Library/Developer/CommandLineTools/usr/lib"

# ── Android cross-compilation targets ──────────────────────────────────
# cargo build -p pokered-android --target aarch64-linux-android
#
# The linker names below are resolved via PATH. Cargo does NOT interpolate
# `{PATH}` in [env] values and won't override an already-set PATH without
# force, so the NDK bin dir must be exported before invoking cargo:
#   android/build.sh does this locally; CI does it in the workflow step.

[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"
rustflags = ["-C", "link-arg=-lc++"]

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"
rustflags = ["-C", "link-arg=-lc++"]

[target.x86_64-linux-android]
linker = "x86_64-linux-android21-clang"
rustflags = ["-C", "link-arg=-lc++"]

# ── iOS cross-compilation targets ─────────────────────────────────────
# cargo build -p pokered-ios --target aarch64-apple-ios-sim
# No linker/rustflags needed — Xcode toolchain handles iOS linking.

[target.aarch64-apple-ios]

[target.aarch64-apple-ios-sim]

[alias]
run-wasm = "run --release --package run-wasm --"
