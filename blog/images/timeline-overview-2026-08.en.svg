  <!-- ===== Footer ===== -->
  <text x="80" y="681" font-size="9.5" fill="#64748B">* Aug bar is the cross-repo total (74 + 67 = 141); LOC = cumulative Rust+Web+Python+DSL lines, the sum of game + engine repos after 08-09. Diamonds = external model releases; dots = in-repo events (X axis mapped linearly by date).</text>
  <text x="80" y="699" font-size="9.5" fill="#64748B">How to read the layers: harness decides "how much can be delegated at once", models decide "how good the brain is", toolchain decides "how fast the hands are" — their product is each phase's actual output rate.</text>

