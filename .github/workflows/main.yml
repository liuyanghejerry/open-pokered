name: CI

on:
  push:
    branches: [ master ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # dotzuki engine deps are fetched from a private GitHub repo over ssh; use
  # the git CLI so GIT_SSH_COMMAND (deploy key, set up per job) applies.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pokered-data: ${{ steps.filter.outputs.pokered-data }}
      pokered-core: ${{ steps.filter.outputs.pokered-core }}
      pokered-renderer: ${{ steps.filter.outputs.pokered-renderer }}
      pokered-audio: ${{ steps.filter.outputs.pokered-audio }}
      pokered-app: ${{ steps.filter.outputs.pokered-app }}
      pokered-web: ${{ steps.filter.outputs.pokered-web }}
      pokered-runner-web: ${{ steps.filter.outputs.pokered-runner-web }}
      pokered-tui: ${{ steps.filter.outputs.pokered-tui }}
      pokered-android: ${{ steps.filter.outputs.pokered-android }}
      pokered-ios: ${{ steps.filter.outputs.pokered-ios }}
      pokered-debug-server: ${{ steps.filter.outputs.pokered-debug-server }}
      pokered-ui: ${{ steps.filter.outputs.pokered-ui }}
      pokered-ui-preview: ${{ steps.filter.outputs.pokered-ui-preview }}
      pokered-layout-preview: ${{ steps.filter.outputs.pokered-layout-preview }}
      scene_apply: ${{ steps.filter.outputs.scene_apply }}
      pokered-editor: ${{ steps.filter.outputs.pokered-editor }}
      changes-list: ${{ steps.build-changes-list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pokered-data:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-data/**'
            pokered-core:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-core/**'
            pokered-renderer:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-renderer/**'
            pokered-audio:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-audio/**'
            pokered-app:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-app/**'
            pokered-web:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-web/**'
              - 'crates/pokered-core/**'
              - 'crates/pokered-data/**'
              - 'crates/pokered-renderer/**'
              - 'crates/pokered-audio/**'
              - 'crates/pokered-app/**'
            pokered-runner-web:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-runner-web/**'
              - 'crates/pokered-core/**'
              - 'crates/pokered-data/**'
              - 'crates/pokered-renderer/**'
              - 'crates/pokered-app/**'
            pokered-tui:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-tui/**'
            pokered-android:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '.cargo/config.toml'
              - 'crates/pokered-android/**'
              - 'crates/pokered-app/**'
              - 'crates/pokered-renderer/**'
              - 'crates/pokered-core/**'
              - 'android/**'
            pokered-ios:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-ios/**'
              - 'crates/pokered-app/**'
              - 'crates/pokered-renderer/**'
              - 'crates/pokered-core/**'
              - 'ios/**'
            pokered-debug-server:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-debug-server/**'
            pokered-ui:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-ui/**'
            pokered-ui-preview:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-ui-preview/**'
              - 'crates/pokered-ui/**'
            pokered-layout-preview:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/pokered-layout-preview/**'
            scene_apply:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'crates/scene_apply/**'
            pokered-editor:
              - 'tools/pokered-editor/**'
      - name: Build changes list
        id: build-changes-list
        run: |
          CHANGES=""
          [ "${{ steps.filter.outputs.pokered-data }}" == "true" ]            && CHANGES="$CHANGES pokered-data"            || true
          [ "${{ steps.filter.outputs.pokered-core }}" == "true" ]            && CHANGES="$CHANGES pokered-core"            || true
          [ "${{ steps.filter.outputs.pokered-renderer }}" == "true" ]        && CHANGES="$CHANGES pokered-renderer"        || true
          [ "${{ steps.filter.outputs.pokered-audio }}" == "true" ]           && CHANGES="$CHANGES pokered-audio"           || true
          [ "${{ steps.filter.outputs.pokered-app }}" == "true" ]             && CHANGES="$CHANGES pokered-app"             || true
          [ "${{ steps.filter.outputs.pokered-web }}" == "true" ]             && CHANGES="$CHANGES pokered-web"             || true
          [ "${{ steps.filter.outputs.pokered-runner-web }}" == "true" ]      && CHANGES="$CHANGES pokered-runner-web"      || true
          [ "${{ steps.filter.outputs.pokered-tui }}" == "true" ]             && CHANGES="$CHANGES pokered-tui"             || true
          [ "${{ steps.filter.outputs.pokered-android }}" == "true" ]         && CHANGES="$CHANGES pokered-android"         || true
          [ "${{ steps.filter.outputs.pokered-ios }}" == "true" ]             && CHANGES="$CHANGES pokered-ios"             || true
          [ "${{ steps.filter.outputs.pokered-debug-server }}" == "true" ]    && CHANGES="$CHANGES pokered-debug-server"    || true
          [ "${{ steps.filter.outputs.pokered-ui }}" == "true" ]              && CHANGES="$CHANGES pokered-ui"              || true
          [ "${{ steps.filter.outputs.pokered-ui-preview }}" == "true" ]      && CHANGES="$CHANGES pokered-ui-preview"      || true
          [ "${{ steps.filter.outputs.pokered-layout-preview }}" == "true" ]  && CHANGES="$CHANGES pokered-layout-preview"  || true
          [ "${{ steps.filter.outputs.scene_apply }}" == "true" ]             && CHANGES="$CHANGES scene_apply"             || true
          [ "${{ steps.filter.outputs.pokered-editor }}" == "true" ]          && CHANGES="$CHANGES pokered-editor"          || true
          echo "list=$CHANGES" >> $GITHUB_OUTPUT

  build-rust-packages:
    needs: [detect-changes]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The self-hosted runner is a single machine; running all matrix jobs at
      # once spawns too many concurrent rustc processes and gets OOM-killed.
      # Cap the number of concurrently-building jobs instead.
      max-parallel: 3
      matrix:
        include:
          - package: pokered-data
            build_name: pokered-data
            changes_key: pokered-data
          - package: pokered-core
            build_name: pokered-core
            changes_key: pokered-core
          - package: pokered-renderer
            build_name: pokered-renderer
            changes_key: pokered-renderer
          - package: pokered-audio
            build_name: pokered-audio
            changes_key: pokered-audio
          - package: pokered-app
            build_name: pokered-app
            changes_key: pokered-app
          - package: pokered-web
            build_name: pokered-web (native)
            changes_key: pokered-web
          - package: pokered-runner-web
            build_name: pokered-runner-web
            changes_key: pokered-runner-web
          - package: pokered-tui
            build_name: pokered-tui
            changes_key: pokered-tui
          - package: pokered-debug-server
            build_name: pokered-debug-server
            changes_key: pokered-debug-server
          - package: pokered-ui
            build_name: pokered-ui
            changes_key: pokered-ui
          - package: pokered-ui-preview
            build_name: pokered-ui-preview
            changes_key: pokered-ui-preview
          - package: pokered-layout-preview
            build_name: pokered-layout-preview
            changes_key: pokered-layout-preview
          - package: scene_apply
            build_name: scene_apply
            changes_key: scene_apply
          - package: pokered-web
            target: wasm32-unknown-unknown
            build_name: pokered-web (wasm32-unknown-unknown)
            changes_key: pokered-web
          - package: pokered-runner-web
            target: wasm32-unknown-unknown
            build_name: pokered-runner-web (wasm32-unknown-unknown)
            changes_key: pokered-runner-web
    name: Build ${{ matrix.build_name }}
    steps:
      - name: Check for relevant changes
        id: changes-check
        run: |
          CHANGES_LIST=" ${{ needs.detect-changes.outputs.changes-list }} "
          CHANGES_KEY=" ${{ matrix.changes_key }} "
          if echo "$CHANGES_LIST" | grep -qF "$CHANGES_KEY"; then
            echo "has-changes=true" >> $GITHUB_OUTPUT
          else
            echo "has-changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        if: steps.changes-check.outputs.has-changes == 'true'
        uses: actions/checkout@v4

      - name: Configure dotzuki deploy key
        # dotzuki is a private repo; cargo fetches engine deps over ssh using
        # this read-only deploy key (consumed via CARGO_NET_GIT_FETCH_WITH_CLI).
        if: steps.changes-check.outputs.has-changes == 'true'
        env:
          DOTZUKI_DEPLOY_KEY: ${{ secrets.DOTZUKI_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DOTZUKI_DEPLOY_KEY" > ~/.ssh/dotzuki_deploy_key
          chmod 600 ~/.ssh/dotzuki_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/dotzuki_deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Fetch gfx assets
        # gfx/ is not committed (fetched from pret/pokered). Renderer/app tests
        # read it from disk; the pokered-web wasm build embeds it at build time.
        if: steps.changes-check.outputs.has-changes == 'true'
        run: ./scripts/fetch-gfx.sh

      - name: Install system dependencies
        if: steps.changes-check.outputs.has-changes == 'true'
        run: |
          # The preinstalled Microsoft apt repos (azure-cli, microsoft-prod)
          # intermittently 403 on apt-get update; we don't need anything from
          # them, so drop them before updating.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.* /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust toolchain
        if: steps.changes-check.outputs.has-changes == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install wasm target
        if: ${{ steps.changes-check.outputs.has-changes == 'true' && matrix.target == 'wasm32-unknown-unknown' }}
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry & build
        if: steps.changes-check.outputs.has-changes == 'true'
        # rust-cache prunes the target dir before saving and uses its own key
        # namespace; the old actions/cache entries grew to 1 GB+ and stalled
        # restores on GitHub-hosted runners.
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target || 'native' }}

      - name: Build native package
        if: ${{ steps.changes-check.outputs.has-changes == 'true' && !matrix.target }}
        run: cargo build -p ${{ matrix.package }}

      - name: Test native package
        if: ${{ steps.changes-check.outputs.has-changes == 'true' && !matrix.target }}
        run: |
          # render tests dump debug PNGs via std::env::temp_dir(); the
          # runner's /tmp rejects writes, so use the per-job temp dir.
          export TMPDIR="$RUNNER_TEMP/test-tmp"
          mkdir -p "$TMPDIR"
          cargo test -p ${{ matrix.package }}

      - name: Build targeted package
        if: ${{ steps.changes-check.outputs.has-changes == 'true' && matrix.target }}
        run: cargo build -p ${{ matrix.package }} --target ${{ matrix.target }}

  coverage:
    permissions:
      contents: read
    name: Coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure dotzuki deploy key
        env:
          DOTZUKI_DEPLOY_KEY: ${{ secrets.DOTZUKI_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DOTZUKI_DEPLOY_KEY" > ~/.ssh/dotzuki_deploy_key
          chmod 600 ~/.ssh/dotzuki_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/dotzuki_deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Fetch gfx assets
        # gfx/ is not committed; pokered-data embeds it at build time.
        run: ./scripts/fetch-gfx.sh

      - name: Install system dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.* /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -yq \
            build-essential \
            pkg-config \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxcursor-dev \
            libvulkan-dev \
            libasound2-dev \
            libudev-dev

      - name: Free disk space
        # The instrumented llvm-cov build needs well over the ~14 GB a stock
        # ubuntu-latest runner has free; linking otherwise dies with SIGBUS.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /usr/local/julia* || true
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: coverage

      - name: Run coverage
        # --workspace: all crates; summary table goes to the job log, the
        # lcov report is uploaded as an artifact for inspection.
        run: |
          export TMPDIR="$RUNNER_TEMP/test-tmp"
          mkdir -p "$TMPDIR"
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --summary-only

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 30

  build-pokered-editor:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.pokered-editor == 'true' }}
    permissions:
      contents: read
    name: Build pokered-editor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tools/pokered-editor/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: tools/pokered-editor
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: tools/pokered-editor
        run: pnpm exec vue-tsc --noEmit

      - name: Test
        working-directory: tools/pokered-editor
        run: pnpm exec vitest run

      - name: Build
        working-directory: tools/pokered-editor
        run: pnpm run build

  build-android-apk:
    needs: [detect-changes]
    if: ${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && needs.detect-changes.outputs.pokered-android == 'true' }}
    permissions:
      contents: read
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure dotzuki deploy key
        env:
          DOTZUKI_DEPLOY_KEY: ${{ secrets.DOTZUKI_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DOTZUKI_DEPLOY_KEY" > ~/.ssh/dotzuki_deploy_key
          chmod 600 ~/.ssh/dotzuki_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/dotzuki_deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Fetch gfx assets
        # Android build embeds gfx/ into the .so at build time (build.rs).
        run: ./scripts/fetch-gfx.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        id: setup-android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-cargo-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: android-gradle-

      - name: Build Rust library
        run: |
          # .cargo/config.toml uses bare NDK linker names
          # (aarch64-linux-android21-clang), so the NDK's prebuilt LLVM
          # bin dir must be on PATH — same as android/build.sh does locally.
          # setup-android has no ndk-path output; ANDROID_HOME is exported
          # globally by the action and the NDK sits under $ANDROID_HOME/ndk/.
          NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          export PATH="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          cargo build -p pokered-android --target aarch64-linux-android --release

      - name: Copy .so to jniLibs
        run: |
          JNILIBS="android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$JNILIBS"
          cp target/aarch64-linux-android/release/libpokered_android.so "$JNILIBS/"
          cp target/aarch64-linux-android/release/libpokered_android.so "$JNILIBS/libgame-activity.so"
          # Bundle the C++ runtime (linked via `-C link-arg=-lc++`), same as
          # android/build.sh — it lives in the NDK sysroot, not target/.
          NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          cp "$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$JNILIBS/"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x lintDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokered-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-ios-app:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.pokered-ios == 'true' }}
    permissions:
      contents: read
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure dotzuki deploy key
        env:
          DOTZUKI_DEPLOY_KEY: ${{ secrets.DOTZUKI_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DOTZUKI_DEPLOY_KEY" > ~/.ssh/dotzuki_deploy_key
          chmod 600 ~/.ssh/dotzuki_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/dotzuki_deploy_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Fetch gfx assets
        # iOS build embeds gfx/ into the staticlib at build time (build.rs).
        run: ./scripts/fetch-gfx.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add iOS targets
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ios-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml') }}
          restore-keys: |
            ios-cargo-

      - name: Build Rust library (device)
        run: cargo build -p pokered-ios --target aarch64-apple-ios --release

      - name: Build Rust library (simulator)
        run: cargo build -p pokered-ios --target aarch64-apple-ios-sim --release

      - name: Copy .a files to Xcode lib directory
        run: |
          mkdir -p ios/Pokered/lib
          cp target/aarch64-apple-ios/release/libpokered_ios.a ios/Pokered/lib/libpokered_ios_device.a
          cp target/aarch64-apple-ios-sim/release/libpokered_ios.a ios/Pokered/lib/libpokered_ios_sim.a

      - name: Build Xcode project (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project Pokered.xcodeproj \
            -target Pokered \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            build
