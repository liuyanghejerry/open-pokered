name: Deploy Jev Dashboard

on:
  push:
    branches: [feat/typesafe-semantic-judgments]
    paths:
      - docs/jev-retrospective-assets/**
      - docs/jev-autonomous-retrospective.md
      - scripts/stage_jev_dashboard.py
      - .github/workflows/deploy-jev-dashboard.yml
      - .gitattributes
  workflow_dispatch:
    inputs:
      base_run_id:
        description: 'Successful Deploy Web run to preserve (empty = latest successful master run)'
        type: string
        required: false

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore dashboard videos from Git LFS
        run: |
          git lfs install --local
          git lfs pull --include='docs/jev-retrospective-assets/*.mp4,docs/jev-retrospective-assets/full-run/*full.mp4,docs/jev-retrospective-assets/full-run/script-*failure.mp4,docs/jev-retrospective-assets/full-run/script-moon-navigation.mp4,docs/jev-retrospective-assets/full-run/script-original-machine-boot.mp4'
      - name: Restore the existing game and editor
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN_ID: ${{ inputs.base_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$BASE_RUN_ID" ]; then
            BASE_RUN_ID=$(gh api "repos/$REPOSITORY/actions/workflows/deploy-web.yml/runs?branch=master&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          [[ "$BASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'No successful base deployment found'; exit 1; }
          gh api "repos/$REPOSITORY/actions/runs/$BASE_RUN_ID" --jq '.conclusion' | grep -qx success
          gh run download "$BASE_RUN_ID" --repo "$REPOSITORY" --name github-pages --dir base-artifact || {
            echo 'Base artifact expired. Run deploy-web.yml on master, then retry this deployment.'
            exit 1
          }
          mkdir _site
          tar -xf base-artifact/artifact.tar -C _site
          test -s _site/index.html
          test -s _site/editor/index.html
          echo "Preserved game/editor from run $BASE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Add the dashboard under its own path
        run: python3 scripts/stage_jev_dashboard.py --site _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 7
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}jev-dashboard/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
