name: Deploy Web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch gfx assets
        # gfx/ is not committed; the wasm build embeds it at build time (build.rs).
        run: ./scripts/fetch-gfx.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-bindgen-cli
        # The CLI's bindgen schema version must exactly match the wasm-bindgen
        # crate version in Cargo.lock, so derive it from the lockfile instead
        # of pinning it here.
        run: |
          WBG_VERSION=$(awk '/^name = "wasm-bindgen"$/{getline; if ($1 == "version") {gsub(/"/, "", $3); print $3; exit}}' Cargo.lock)
          test -n "$WBG_VERSION"
          cargo install wasm-bindgen-cli --version "$WBG_VERSION" --locked

      - name: Build Rust → WASM (release)
        run: |
          cargo build -p pokered-web --target wasm32-unknown-unknown --release

      - name: Generate JS bindings
        working-directory: crates/pokered-web
        run: |
          WASM_BIN="${{ github.workspace }}/target/wasm32-unknown-unknown/release/pokered_web.wasm"
          WASM_OUT_DIR="frontend/src/wasm"
          rm -f "$WASM_OUT_DIR"/*.wasm "$WASM_OUT_DIR"/*.js
          wasm-bindgen --target web --no-typescript --out-dir "$WASM_OUT_DIR" "$WASM_BIN"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: crates/pokered-web/frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: crates/pokered-web/frontend
        run: pnpm install --frozen-lockfile

      - name: Build Vite bundle
        working-directory: crates/pokered-web/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm run build

      # ── pokered-editor (WYSIWYG editor) → /<repo>/editor/ ──────────────
      # GitHub Pages gives one site per repo; the editor shares it with the
      # game under a sub-path. Static hosting has no /api backend, so
      # dataFetch routes /api/* onto IndexedDB deltas + these static
      # baselines; every /gfx image is copied into dist/gfx so base-prefixed
      # asset URLs resolve instead of 404ing. Both wasm bridges are bundled
      # into dist/editor/wasm/: pokered-runner-web (Playtest / Game preview)
      # and pokered-layout-preview (Layout editor .gui compile + preview).
      - name: Build editor wasm (pokered-runner-web)
        run: cargo build -p pokered-runner-web --target wasm32-unknown-unknown --release

      - name: Generate editor wasm bindings
        working-directory: crates/pokered-runner-web
        run: |
          WASM_BIN="${{ github.workspace }}/target/wasm32-unknown-unknown/release/pokered_runner_web.wasm"
          mkdir -p editor-wasm
          wasm-bindgen --target web --no-typescript --out-dir editor-wasm "$WASM_BIN"

      - name: Build layout-preview wasm (pokered-layout-preview)
        run: cargo build -p pokered-layout-preview --target wasm32-unknown-unknown --release

      - name: Generate layout-preview wasm bindings
        working-directory: crates/pokered-layout-preview
        run: |
          WASM_BIN="${{ github.workspace }}/target/wasm32-unknown-unknown/release/pokered_layout_preview.wasm"
          mkdir -p editor-wasm
          wasm-bindgen --target web --no-typescript --out-dir editor-wasm "$WASM_BIN"

      - name: Setup Node.js (editor)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: tools/pokered-editor/pnpm-lock.yaml

      - name: Install editor dependencies
        working-directory: tools/pokered-editor
        run: pnpm install --frozen-lockfile

      - name: Build editor Vite bundle
        working-directory: tools/pokered-editor
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/editor/
        run: pnpm run build

      - name: Generate editor static data baseline + gfx
        # Bundles pokered-data JSON (maps/trainers/pokemon/moves/items/
        # ui_layouts + blocksets/passable-tiles/town-map/tileset-extras) into
        # dist/data, writes dist/maps.json (static warp list) and copies the
        # gfx tree into dist/gfx so image URLs work on static hosting.
        # dataFetch GETs fall back to these baselines, PUTs persist to
        # IndexedDB deltas. See tools/pokered-editor/scripts/generate-static-data.mjs.
        run: node tools/pokered-editor/scripts/generate-static-data.mjs

      - name: Merge editor into Pages artifact
        run: |
          DEST="crates/pokered-web/frontend/dist/editor"
          mkdir -p "$DEST"
          cp -r tools/pokered-editor/dist/. "$DEST/"
          mkdir -p "$DEST/wasm"
          cp -r crates/pokered-runner-web/editor-wasm/. "$DEST/wasm/"
          cp -r crates/pokered-layout-preview/editor-wasm/. "$DEST/wasm/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: crates/pokered-web/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
