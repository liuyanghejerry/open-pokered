[package]
name = "pokered-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

# Declarative immediate-mode menu layout engine for Pokémon Red/Blue.
#
# Provides a backend-agnostic `Painter` trait + a closure-based `Ui` builder
# in 8x8 tile units, with a `FrameBufferPainter` for the pixel backend used
# by both pokered-app (native/web) and pokered-tui (which renders the same
# FrameBuffer to terminal halfblocks; see ADR in
# .sisyphus/plans/menu-layout-engine.md Appendix A.4).

[dependencies]
pokered-platform = { path = "../pokered-platform" }
dotzuki-engine = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "ff66260e9c9382fd3aa53afc05dc2e1ce57c61e0" }
pokered-core = { path = "../pokered-core" }
pokered-data = { path = "../pokered-data" }
pokered-renderer = { path = "../pokered-renderer", default-features = false }
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "ff66260e9c9382fd3aa53afc05dc2e1ce57c61e0", default-features = false, features = ["framebuffer"] }
dotzuki-ui = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "ff66260e9c9382fd3aa53afc05dc2e1ce57c61e0" }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"

[features]
default = ["gpu"]
framebuffer = ["pokered-renderer/framebuffer"]
gpu = ["pokered-renderer/gpu"]

# Hosted gpu windowing: full dotzuki-renderer (pixels/winit/resource).
# Bare metal (GBA, target_os = "none") builds with default-features = false
# and gets the framebuffer-only engine renderer declared above.
[target.'cfg(not(target_os = "none"))'.dependencies]
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "ff66260e9c9382fd3aa53afc05dc2e1ce57c61e0", features = ["gpu", "resource"] }
pokered-renderer = { path = "../pokered-renderer", features = ["gpu"] }

# Bare metal (GBA): spin-backed sync shims (crate::sync_compat).
[target.'cfg(target_os = "none")'.dependencies]

[dev-dependencies]
pokered-data = { path = "../pokered-data" }
