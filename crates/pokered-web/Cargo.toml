[package]
name = "pokered-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
optimize = ["log/release_max_level_warn"]
embedded-scripts = ["pokered-core/embedded-scripts"]
embedded-map-data = ["pokered-core/embedded-map-data"]
default = ["optimize", "embedded-scripts", "embedded-map-data"]

[dependencies]
pokered-core = { path = "../pokered-core" }
pokered-data = { path = "../pokered-data" }
pokered-renderer = { path = "../pokered-renderer" }
pokered-audio = { path = "../pokered-audio" }
pokered-app = { path = "../pokered-app" }
error-iter = "0.4"
log = "0.4"
pixels = "=0.15.0"
winit = "0.30"
cargo-run-wasm = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["GpuTextureFormat", "Window", "Performance", "Location"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.10"
pollster = "0.3"
