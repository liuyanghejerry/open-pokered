[package]
name = "pokered-web"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
optimize = ["log/release_max_level_warn"]
embedded-scripts = ["pokered-core/embedded-scripts"]
embedded-map-data = ["pokered-core/embedded-map-data"]
default = ["optimize", "embedded-scripts", "embedded-map-data"]

[dependencies]
pokered-core = { path = "../pokered-core" }
pokered-renderer = { path = "../pokered-renderer" }
pokered-app = { path = "../pokered-app" }
# Generic pixels+winit game shell (browser canvas / native fallback window,
# GB-frame pacing); patched to the sibling dotzuki checkout by the workspace
# root [patch].
dotzuki-web = { git = "https://github.com/liuyanghejerry/dotzuki", tag = "v0.5.6", features = ["game-shell"] }
log = "0.4"
cargo-run-wasm = "0.4.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Location"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.10"
pollster = "0.3"
