[package]
name = "pokered-audio"
version.workspace = true
edition.workspace = true

[features]
default = []
# Shared device output (`output::AudioOutput`) for the native frontends
# (pokered-app, pokered-tui): a cpal stream pulling samples from the shared
# AudioManager. Forwarded to dotzuki-audio's `cpal` backend.
cpal = ["dotzuki-audio/cpal"]
# Shared browser output for the WASM frontend (Web Audio
# ScriptProcessorNode). Forwarded to dotzuki-audio's `web-audio` backend.
web-audio = ["dotzuki-audio/web-audio"]

[dependencies]
bitflags = "2"

# Hosted builds pull the full dotzuki-audio (APU, sequencer, manager and the
# cpal/web-audio device backends behind the crate features above).
[target.'cfg(not(target_os = "none"))'.dependencies]
dotzuki-audio = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "b827f3cb916f0383774823fd3ca3c12b344e511d" }

# Bare metal (GBA): no audio device layer — only the music/SFX data tables
# plus the no-op `output::AudioOutput` compile; dotzuki-audio is not pulled.

# The generated music/SFX tables are the game runtime's source of truth, so the
# library build keeps `dotzuki-audio` dependency-light (no serde). Tests and the
# `export_audio` example opt into the file-based `format`/`library` API — dev
# feature activation only affects those targets, not `cargo build`.
[dev-dependencies]
dotzuki-audio = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "b827f3cb916f0383774823fd3ca3c12b344e511d", features = ["serde"] }
serde_json = "1"
