[package]
name = "pokered-audio"
version.workspace = true
edition.workspace = true

[dependencies]
dotzuki-audio = { git = "ssh://git@github.com/liuyanghejerry/dotzuki.git", tag = "v0.4.0" }
bitflags = "2"

# The generated music/SFX tables are the game runtime's source of truth, so the
# library build keeps `dotzuki-audio` dependency-light (no serde). Tests and the
# `export_audio` example opt into the file-based `format`/`library` API — dev
# feature activation only affects those targets, not `cargo build`.
[dev-dependencies]
dotzuki-audio = { git = "ssh://git@github.com/liuyanghejerry/dotzuki.git", tag = "v0.4.0", features = ["serde"] }
serde_json = "1"
