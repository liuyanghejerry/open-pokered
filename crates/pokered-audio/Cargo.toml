[package]
name = "pokered-audio"
version.workspace = true
edition.workspace = true

[features]
default = []
source-clock-serde = ["dep:serde"]
# Shared device output (`output::AudioOutput`) for the native frontends
# (pokered-app, pokered-tui): a cpal stream pulling samples from the shared
# AudioManager. Forwarded to dotzuki-audio's `cpal` backend.
cpal = ["dotzuki-audio/cpal"]
# Shared browser output for the WASM frontend (Web Audio
# ScriptProcessorNode). Forwarded to dotzuki-audio's `web-audio` backend.
web-audio = ["dotzuki-audio/web-audio"]

[dependencies]
bitflags = "2"
serde = { version = "1", default-features = false, features = ["derive"], optional = true }

# The sequencer/APU supports alloc + no_std on GBA; device backends remain optional.
dotzuki-audio = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "8a6e0dd5372fb8cd00e36aae38881e47d6ec2ea8" }

# An allocation-free VBlank counter keeps PSG tempo independent of slow draws.
[target.'cfg(target_os = "none")'.dependencies]
agb = { version = "0.25.0", default-features = false }
critical-section = "1"

# The generated music/SFX tables are the game runtime's source of truth, so the
# default library build keeps `dotzuki-audio` dependency-light (no serde). Tests and the
# `export_audio` example opt into the file-based `format`/`library` API — dev
# feature activation only affects those targets, not `cargo build`.
[dev-dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
dotzuki-audio = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "8a6e0dd5372fb8cd00e36aae38881e47d6ec2ea8", features = ["serde"] }
serde_json = "1"
