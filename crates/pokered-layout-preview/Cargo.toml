[package]
name = "pokered-layout-preview"
version.workspace = true
edition.workspace = true

# rlib is included alongside cdylib so the crate can be checked/tested natively
# (`cargo test -p pokered-layout-preview`); wasm-pack still consumes the cdylib.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "ff66260e9c9382fd3aa53afc05dc2e1ce57c61e0" }
dotzuki-engine = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "ff66260e9c9382fd3aa53afc05dc2e1ce57c61e0" }
dotzuki-ui = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "ff66260e9c9382fd3aa53afc05dc2e1ce57c61e0" }
dotzuki-engine-dsl = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "ff66260e9c9382fd3aa53afc05dc2e1ce57c61e0" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
