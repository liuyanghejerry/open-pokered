[package]
name = "pokered-layout-preview"
version.workspace = true
edition.workspace = true

# rlib is included alongside cdylib so the crate can be checked/tested natively
# (`cargo test -p pokered-layout-preview`); wasm-pack still consumes the cdylib.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "febe87eab83dc28d209e6b13a3f03d1f6efec82e" }
dotzuki-engine = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "febe87eab83dc28d209e6b13a3f03d1f6efec82e" }
dotzuki-ui = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "febe87eab83dc28d209e6b13a3f03d1f6efec82e" }
dotzuki-engine-dsl = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "febe87eab83dc28d209e6b13a3f03d1f6efec82e" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
