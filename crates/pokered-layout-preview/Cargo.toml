[package]
name = "pokered-layout-preview"
version.workspace = true
edition.workspace = true

# rlib is included alongside cdylib so the crate can be checked/tested natively
# (`cargo test -p pokered-layout-preview`); wasm-pack still consumes the cdylib.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "1c6cea350960519e12254e9a375c00a7ceb4b1b2" }
dotzuki-engine = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "1c6cea350960519e12254e9a375c00a7ceb4b1b2" }
dotzuki-ui = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "1c6cea350960519e12254e9a375c00a7ceb4b1b2" }
dotzuki-engine-dsl = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "1c6cea350960519e12254e9a375c00a7ceb4b1b2" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
