[package]
name = "pokered-tui"
version.workspace = true
edition.workspace = true

[features]
embedded-scripts = ["pokered-app/embedded-scripts"]
embedded-map-data = ["pokered-app/embedded-map-data"]

[dependencies]
pokered-app = { path = "../pokered-app", default-features = false }
pokered-data = { path = "../pokered-data" }
pokered-renderer = { path = "../pokered-renderer", default-features = false, features = ["framebuffer", "resource"] }
dotzuki-tui = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "92ba95f9526107e17874df53291ac7758d0930f0" }
# Device output comes from pokered-audio's `cpal` feature (the shared
# `output::AudioOutput`, built on dotzuki-audio's cpal backend).
pokered-audio = { path = "../pokered-audio", features = ["cpal"] }
anyhow = { workspace = true }
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
pokered-core = { path = "../pokered-core" }
dotzuki-engine = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "92ba95f9526107e17874df53291ac7758d0930f0" }
