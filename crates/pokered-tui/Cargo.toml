[package]
name = "pokered-tui"
version.workspace = true
edition.workspace = true

[features]
embedded-scripts = ["pokered-core/embedded-scripts"]
embedded-map-data = ["pokered-core/embedded-map-data"]

[dependencies]
pokered-core = { path = "../pokered-core" }
pokered-data = { path = "../pokered-data" }
dotzuki-engine = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "2929ae90054c5f9828f9999593a1d3f0af7ca3fc" }
pokered-renderer = { path = "../pokered-renderer" }
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "2929ae90054c5f9828f9999593a1d3f0af7ca3fc" }
dotzuki-tui = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "2929ae90054c5f9828f9999593a1d3f0af7ca3fc" }
# Device output comes from pokered-audio's `cpal` feature (the shared
# `output::AudioOutput`, built on dotzuki-audio's cpal backend).
pokered-audio = { path = "../pokered-audio", features = ["cpal"] }
pokered-ui = { path = "../pokered-ui" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
