[package]
name = "pokered-mobile"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
dotzuki-mobile = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "b3389535e284ef48bf4c54d95156d1a21b7c1312" }
pokered-app = { path = "../pokered-app", default-features = false, features = ["mobile"] }
pokered-core = { path = "../pokered-core" }
pokered-renderer = { path = "../pokered-renderer", default-features = false, features = ["resource", "embedded-assets"] }

[dev-dependencies]
serde_json = "1"
