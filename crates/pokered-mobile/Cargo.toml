[package]
name = "pokered-mobile"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
dotzuki-mobile = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "976f86b42813a657047db89ca4dca2d6b9172dff" }
pokered-app = { path = "../pokered-app", default-features = false, features = ["mobile"] }
pokered-core = { path = "../pokered-core" }
pokered-renderer = { path = "../pokered-renderer", default-features = false, features = ["resource", "embedded-assets"] }

[dev-dependencies]
serde_json = "1"
