[package]
name = "pokered-app"
version.workspace = true
edition.workspace = true

[features]
embedded-scripts = ["pokered-core/embedded-scripts"]
embedded-map-data = ["pokered-core/embedded-map-data"]
debug-server = ["pokered-debug-server"]

[dependencies]
pokered-core = { path = "../pokered-core" }
pokered-data = { path = "../pokered-data" }
dotzuki-engine = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "366e5026e872466305b8b338082a8de9f7969b5b" }
dotzuki-engine-dsl = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "366e5026e872466305b8b338082a8de9f7969b5b" }
pokered-renderer = { path = "../pokered-renderer", default-features = false, features = ["framebuffer"] }
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "366e5026e872466305b8b338082a8de9f7969b5b", default-features = false }
pokered-ui = { path = "../pokered-ui", default-features = false, features = ["framebuffer"] }
# Base audio crate (music/SFX data tables + ids) on every target; the cpal
# device backend is added by the hosted target table below. Bare metal gets
# a no-op AudioOutput stub from pokered-audio itself.
pokered-audio = { path = "../pokered-audio" }
pokered-debug-server = { path = "../pokered-debug-server", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
# no_std HashMap (see pokered-data's twin entry); needed wherever the app
# passes maps to pokered-core APIs that now use hashbrown.
hashbrown = { version = "0.15", default-features = false, features = ["serde"] }

# Hosted builds want the full renderer (gpu windowing, PNG resource loading,
# audio device glue, link play, CLI tooling). Bare metal (GBA,
# target_os = "none") gets framebuffer-only builds — see the target tables
# in the individual crate manifests.
[target.'cfg(not(target_os = "none"))'.dependencies]
pokered-renderer = { path = "../pokered-renderer", features = ["gpu"] }
pokered-ui = { path = "../pokered-ui", features = ["gpu"] }
dotzuki-app = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "366e5026e872466305b8b338082a8de9f7969b5b" }
image = { version = "0.25", default-features = false, features = ["png"] }

# Bare metal (GBA): spin locks for the single-threaded lazy statics
# (render/slots.rs).
[target.'cfg(target_os = "none")'.dependencies]

# Hosted-only (std-bound) app dependencies. Bare-metal builds (GBA,
# target_os = "none") exclude windowing/CLI/filesystem/audio/link crates.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "none")))'.dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
# Native device output comes from pokered-audio's `cpal` feature (the shared
# `output::AudioOutput`, built on dotzuki-audio's cpal backend).
pokered-audio = { path = "../pokered-audio", features = ["cpal"] }
clap = { version = "4", features = ["derive"] }
notify = "6"

# The play_audio_test example drives a raw cpal stream for diagnostics.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
cpal = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser device output comes from pokered-audio's `web-audio` feature (the
# shared `output::AudioOutput`, built on dotzuki-audio's Web Audio backend).
pokered-audio = { path = "../pokered-audio", features = ["web-audio"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "BroadcastChannel",
    "MessageEvent",
    "Window",
    "Storage",
] }

# The BroadcastChannel link transport is engine-generic and lives in
# dotzuki-web (its `link` feature); patched to the sibling dotzuki checkout
# by the workspace root [patch]. Sub-table form keeps the existing wasm32
# dependencies section above untouched.
[target.'cfg(target_arch = "wasm32")'.dependencies.dotzuki-web]
git = "https://github.com/liuyanghejerry/dotzuki"
rev = "366e5026e872466305b8b338082a8de9f7969b5b"
features = ["link"]
