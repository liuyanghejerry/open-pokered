[package]
name = "pokered-app"
version.workspace = true
edition.workspace = true

[features]
embedded-scripts = ["pokered-core/embedded-scripts"]
embedded-map-data = ["pokered-core/embedded-map-data"]
debug-server = ["pokered-debug-server"]

[dependencies]
pokered-core = { path = "../pokered-core" }
pokered-data = { path = "../pokered-data" }
dotzuki-engine = { git = "https://github.com/liuyanghejerry/dotzuki", tag = "v0.5.3" }
dotzuki-engine-dsl = { git = "https://github.com/liuyanghejerry/dotzuki", tag = "v0.5.3" }
pokered-renderer = { path = "../pokered-renderer" }
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", tag = "v0.5.3" }
dotzuki-app = { git = "https://github.com/liuyanghejerry/dotzuki", tag = "v0.5.3" }
pokered-ui = { path = "../pokered-ui" }
pokered-audio = { path = "../pokered-audio" }
pokered-debug-server = { path = "../pokered-debug-server", optional = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.15"
clap = { version = "4", features = ["derive"] }
notify = "6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "AudioContextOptions",
    "AudioContextState",
    "AudioDestinationNode",
    "AudioBuffer",
    "AudioBufferSourceNode",
    "AudioProcessingEvent",
    "ScriptProcessorNode",
    "BroadcastChannel",
    "MessageEvent",
    "Window",
    "Storage",
] }
