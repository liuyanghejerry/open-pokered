[package]
name = "pokered-data"
version.workspace = true
edition.workspace = true

[features]
default = []
serde = []
embedded-map-data = []
# The Boa-based JS registrar — only for the legacy `script-boa` engine path;
# requires boa_engine, which cannot build on bare metal (target_os = "none").
script-boa = ["dep:boa_engine", "dotzuki-engine-script/script-boa"]

[dependencies]
dotzuki-engine-script = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "72e4cf62bd3fb5a5fd27fc7c726ebc6b4343b6c2", default-features = false }
dotzuki-engine-dsl = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "72e4cf62bd3fb5a5fd27fc7c726ebc6b4343b6c2" }
boa_engine = { version = "0.20", default-features = false, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
num-derive = { workspace = true }
num-traits = { workspace = true }
log = "0.4"
dotzuki-engine = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "72e4cf62bd3fb5a5fd27fc7c726ebc6b4343b6c2" }
# no_std HashMap (std::collections::HashMap replacement; iteration order is
# unspecified either way, same contract as std).
hashbrown = { version = "0.15", default-features = false, features = ["serde"] }

# Hosted: full dotzuki-renderer (gpu + PNG resource pipeline).
[target.'cfg(not(target_os = "none"))'.dependencies]
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "72e4cf62bd3fb5a5fd27fc7c726ebc6b4343b6c2" }
thiserror = { workspace = true }

# Bare metal (GBA): framebuffer-only engine renderer.
[target.'cfg(target_os = "none")'.dependencies]
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "72e4cf62bd3fb5a5fd27fc7c726ebc6b4343b6c2", default-features = false, features = ["framebuffer"] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
ron = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
dotzuki-engine-dsl = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "72e4cf62bd3fb5a5fd27fc7c726ebc6b4343b6c2" }
