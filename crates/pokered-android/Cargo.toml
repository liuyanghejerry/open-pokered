[package]
name = "pokered-android"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
embedded-scripts = ["pokered-core/embedded-scripts"]
embedded-map-data = ["pokered-core/embedded-map-data"]
default = ["embedded-scripts", "embedded-map-data"]

[dependencies]
pokered-app = { path = "../../examples/pokered/crates/pokered-app" }
pokered-core = { path = "../../examples/pokered/crates/pokered-core" }
pokered-data = { path = "../../examples/pokered/crates/pokered-data" }
pokered-renderer = { path = "../../examples/pokered/crates/pokered-renderer" }
pokered-audio = { path = "../../examples/pokered/crates/pokered-audio" }

winit = { version = "0.30", features = ["android-native-activity"] }
pixels = "=0.15.0"
log = "0.4"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
jni = { version = "0.21", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.10"
