[package]
name = "pokered-core"
version.workspace = true
edition.workspace = true

[features]
embedded-scripts = ["dotzuki-engine-script/embedded-scripts"]
embedded-map-data = ["pokered-data/embedded-map-data"]
# Use the legacy Boa (JavaScript) script engine for overworld scenes instead
# of the default native DSL-AST interpreter. Kept for development/fallback —
# the AST interpreter is the canonical scene semantics (see
# docs/low-end-hardware-optimization.md §四).
script-boa = ["pokered-data/script-boa", "dotzuki-engine-script/script-boa"]
# P1 battle migration: dev hot-reload of the pokered rules.ron (mirrors minimon's
# dual-mode flag). OFF (default) ⇒ BAKED rules.ron (include_str!, zero file IO);
# ON ⇒ read + watch rules.ron on disk, rebuild the registry between turns. Both
# modes drive the SAME rules.ron. Additive; the production battle loop never reads
# the RON — it stays the legacy oracle (P1 is strictly differential-harness-only).
hot-reload = ["dotzuki-rules/hot-reload"]

[dependencies]
dotzuki-engine = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "162182fde89e414414ac9e9ba0e9a5051804b16d" }
pokered-data = { path = "../pokered-data" }
dotzuki-engine-script = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "162182fde89e414414ac9e9ba0e9a5051804b16d", default-features = false }
# Native script interpreter (de-Boa path): AST interpretation of compiled
# `.scene` storylines — no JavaScript engine involved.
dotzuki-engine-dsl = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "162182fde89e414414ac9e9ba0e9a5051804b16d" }
# P1 battle migration: the game-agnostic no-code RON loader + dual-mode sourcing.
# pokered-core authors a rules.ron for the bucket-A moves and a game binding; the
# loader stays engine-only (no pokered types leak into it). Used by the additive
# PokeredRules provider + the differential parity harness ONLY — the legacy
# `apply_move_effect` dispatcher stays the production oracle (P1 is additive).
dotzuki-rules = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "162182fde89e414414ac9e9ba0e9a5051804b16d" }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
# no_std HashMap (see pokered-data's twin entry).
hashbrown = { version = "0.15", default-features = false, features = ["serde"] }

# Hosted builds keep `rand`'s std defaults (thread_rng / StdRng — OS entropy).
[target.'cfg(not(target_os = "none"))'.dependencies]
rand = { workspace = true, features = ["small_rng"] }
thiserror = { workspace = true }

# Bare-metal (GBA): no std — a global SmallRng seeded through `getrandom`
# (custom source registered by pokered-gba) via `crate::rng`.
[target.'cfg(target_os = "none")'.dependencies]
rand = { version = "0.8", default-features = false, features = ["alloc", "small_rng", "getrandom"] }
thiserror = { version = "2", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = { workspace = true }

[[bench]]
name = "battle_bench"
harness = false

[[bench]]
name = "overworld_bench"
harness = false

[[bench]]
name = "data_bench"
harness = false
