# GBA (thumbv4t-none-eabi) build configuration for pokered-gba.
# This file only takes effect when cargo runs with cwd inside crates/pokered-gba,
# so host builds from the repo root are unaffected.

[unstable]
build-std = ["core", "alloc"]
build-std-features = ["compiler-builtins-mem"]

[build]
target = "thumbv4t-none-eabi"

[target.thumbv4t-none-eabi]
rustflags = [
    "-Clink-arg=-Tgba.ld",
    "-Ctarget-cpu=arm7tdmi",
    "-Cforce-frame-pointers=yes",
]

runner = ["/opt/homebrew/bin/mgba", "-C", "logToStdout=1", "-C", "logLevel.gba.debug=127"]
