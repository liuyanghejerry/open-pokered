[package]
name = "pokered-ui-preview"
version = "0.1.0"
edition = "2021"
publish = false
description = "wasm32 preview shim for pokered-ui layouts; consumed by pokered-editor for WYSIWYG layout editing"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pokered-core = { path = "../pokered-core" }
pokered-ui = { path = "../pokered-ui", default-features = false, features = ["framebuffer"] }
pokered-data = { path = "../pokered-data", features = ["serde"] }
pokered-renderer = { path = "../pokered-renderer", default-features = false }
dotzuki-renderer = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "b827f3cb916f0383774823fd3ca3c12b344e511d" }
serde_json = "1"
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
debug-panic-hook = ["dep:console_error_panic_hook"]
