[package]
name = "dotzuki-web"
version.workspace = true
edition.workspace = true
description = "WASM bridges for the dotzuki JRPG engine: editor layout preview, pixels+winit game shell, BroadcastChannel link transport"
license.workspace = true
repository.workspace = true

# rlib is included alongside cdylib so the audio-render logic can be unit-tested
# natively (`cargo test -p dotzuki-web`); wasm-pack still consumes the cdylib.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dotzuki-renderer = { path = "../dotzuki-renderer", version = "0.6.0" }
dotzuki-engine = { path = "../dotzuki-engine", version = "0.6.0" }
dotzuki-ui = { path = "../dotzuki-ui", version = "0.6.0" }
dotzuki-engine-dsl = { path = "../dotzuki-engine-dsl", version = "0.6.0" }
dotzuki-audio = { path = "../dotzuki-audio", version = "0.6.0", features = ["serde"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Heavy windowing/rendering stack, only pulled in by the `game-shell` feature.
pixels = { version = "=0.15.0", optional = true }
winit = { version = "0.30", optional = true }
error-iter = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true }

[features]
default = []
debug-panic-hook = ["dep:console_error_panic_hook"]
# Real file audio (WAV/OGG/FLAC/MP3) playback bridge — forwarded to
# dotzuki-audio's `modern-audio`; off by default so the WASM bundle stays
# small for projects that only edit chiptune TrackDef JSON.
modern-audio = ["dotzuki-audio/modern-audio"]
# pixels + winit game shell (`game_shell` module): runs a `GameLoop` game in
# a browser canvas (wasm) or a native fallback window, with GB-frame pacing.
# Off by default so the editor layout-preview bridge doesn't drag pixels /
# winit into consumers that never open a window.
game-shell = [
    "dep:pixels",
    "dep:winit",
    "dep:error-iter",
    # `InputState::set_from_keycode` is gated on dotzuki-renderer's `gpu`.
    "dotzuki-renderer/gpu",
    "dep:web-sys",
    "web-sys/Window",
    "web-sys/Document",
    "web-sys/Element",
    "web-sys/Node",
    "web-sys/Event",
    "web-sys/EventTarget",
    "web-sys/Performance",
    "web-sys/HtmlCanvasElement",
    # wgpu's WebGL backend (the shell's wasm surface) exposes adapter limits
    # through this type; some browsers return partial objects for it.
    "web-sys/GpuTextureFormat",
]
# BroadcastChannel link transport (`link` module): two browser tabs on the
# same origin exchange link-protocol messages — no server. The transport
# itself is wasm-only; the frame envelope compiles (and is tested) natively.
link = [
    "dep:web-sys",
    "web-sys/BroadcastChannel",
    "web-sys/MessageEvent",
    "dep:js-sys",
]
