[package]
name = "dotzuki-engine"
version.workspace = true
edition.workspace = true
description = "A general-purpose JRPG game engine built from Game Boy tile rendering principles"
repository = "https://github.com/liuyanghejerry/dotzuki"
license.workspace = true
documentation = "https://docs.rs/dotzuki-engine"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# HashMap/HashSet replacement for no_std builds (std::collections is not
# available on thumbv4t). No default features: the default hasher (foldhash)
# needs core::sync::atomic, which the armv4t target does not provide. The
# engine's `hash` module supplies an atomic-free FxHasher instead.
hashbrown = { version = "0.15", default-features = false, features = ["serde"] }
# expf() for camera smoothing on targets without std (hosted builds keep
# using the intrinsic f32::exp).
libm = "0.2"
# PNG encoding for FrameBuffer::save_png. Optional and OFF by default so
# no_std targets (GBA) don't pull the std-only `image` crate; hosted
# consumers that need PNG export enable the `image` feature.
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[features]
default = []
image = ["dep:image"]
