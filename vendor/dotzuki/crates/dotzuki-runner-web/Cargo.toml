[package]
name = "dotzuki-runner-web"
version.workspace = true
edition.workspace = true
description = "wasm-bindgen shell that embeds dotzuki-runner's RunnerGame in the browser editor for in-page playtests"
license.workspace = true
repository.workspace = true

# rlib is included alongside cdylib so the wrapper can be unit-tested
# natively (`cargo test -p dotzuki-runner-web`); wasm-pack still consumes the cdylib.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dotzuki-runner = { path = "../dotzuki-runner", version = "0.6.0", default-features = false }
dotzuki-renderer = { path = "../dotzuki-renderer", version = "0.6.0", default-features = false, features = ["image-assets"] }
dotzuki-engine = { path = "../dotzuki-engine", version = "0.6.0" }
wasm-bindgen = "0.2"
serde_json = "1"
# Same version as dotzuki-engine-dsl's base64 (features unify workspace-wide).
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
debug-panic-hook = ["dep:console_error_panic_hook"]
# Modern file audio (WAV/OGG/FLAC/MP3) for the WASM runtime — forwarded to
# dotzuki-runner's `modern-audio`; off by default to keep the bundle lean.
modern-audio = ["dotzuki-runner/modern-audio"]

[dev-dependencies]
# Generates the fixture project's tileset.png in tests (same recipe as
# dotzuki-runner's tests/fixture.rs).
image = { version = "0.25", default-features = false, features = ["png"] }
