[package]
name = "dotzuki-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic JRPG UI widget library — dialog, yes/no, flex menu widgets using the Painter trait"

[dependencies]
dotzuki-engine = { path = "../dotzuki-engine", version = "0.6.0" }
# default-features off: the widgets only need the framebuffer-level renderer
# API (fonts, FrameBuffer, painters). This keeps bare-metal (GBA) builds free
# of the gpu/pixels/winit stack; hosted consumers that want windows enable
# dotzuki-renderer's `gpu` feature themselves (feature unification turns it
# back on wherever requested).
dotzuki-renderer = { path = "../dotzuki-renderer", version = "0.6.0", default-features = false }
