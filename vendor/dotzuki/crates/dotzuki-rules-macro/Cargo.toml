[package]
name = "dotzuki-rules-macro"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Proc-macro for compile-time rules.ron to Rust code generation"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing"] }
quote = "1"
proc-macro2 = "1"
ron = { workspace = true }
serde = { workspace = true }
