[package]
name = "dotzuki-engine-dsl"
version = "0.10.0"
edition = "2021"
rust-version = "1.88"
description = "Game DSL compiler (.scene/.gui/.theme/.style) plus a native AST interpreter for the dotzuki JRPG engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/liuyanghejerry/dotzuki"

[dependencies]
dotzuki-engine-script = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "c68c501ed8100b660ca40ce0ececa648897a36dc", version = "0.10.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
thiserror = { version = "2", default-features = false }
# no_std HashMap for the interpreter half (std::collections is unavailable on
# thumbv4t). Same FxHasher setup as dotzuki-engine's `hash` module; duplicated
# here because this crate deliberately does not depend on dotzuki-engine.
hashbrown = { version = "0.15", default-features = false, features = ["serde"] }

# Compiler-half dependencies (miette diagnostics + sourcemap generation + the
# modules that touch the filesystem). Hosted builds only — the GBA build
# compiles just the native AST interpreter half (ast/lexer/parser/interpreter),
# which needs none of these. Note: build-dependency usage (pokered-data's
# build.rs) compiles for the host, where `target_os != "none"`, so the
# compiler half stays available there.
[target.'cfg(not(target_os = "none"))'.dependencies]
miette = { version = "7", features = ["fancy"] }
sourcemap = "9.3.2"

[build-dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sourcemap = "9.3.2"
miette = { version = "7", features = ["fancy"] }
thiserror = { version = "2", default-features = false }
# Included by build.rs alongside src/parser.rs (see src/hash.rs).
hashbrown = { version = "0.15", default-features = false, features = ["serde"] }

[dev-dependencies]
dotzuki-engine-script = { git = "https://github.com/liuyanghejerry/dotzuki", rev = "c68c501ed8100b660ca40ce0ececa648897a36dc", version = "0.10.0" }
base64 = "0.22"
insta = "1.47.2"
