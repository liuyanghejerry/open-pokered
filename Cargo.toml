[workspace]
resolver = "2"
# pokered-gba is built standalone (own .cargo/config.toml, thumbv4t-none-eabi,
# own profiles) — see crates/pokered-gba/build.sh. vendor/ holds the patched
# (no_std) dotzuki engine copy consumed via [patch] from crates/pokered-gba.
exclude = ["crates/pokered-gba", "vendor"]
members = [
    "crates/pokered-web",
    "crates/pokered-runner-web",
    "crates/pokered-debug-server",
    "crates/pokered-android",
    "crates/pokered-ios",
    "crates/scene_apply",
    "crates/pokered-layout-preview",
    "crates/pokered-core",
    "crates/pokered-data",
    "crates/pokered-renderer",
    "crates/pokered-ui",
    "crates/pokered-audio",
    "crates/pokered-app",
    "crates/pokered-ui-preview",
    "crates/pokered-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# no_std-friendly defaults: std-dependent features are opt-in so the GBA
# (thumbv4t-none-eabi) build of the game crates can share these definitions.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
ron = "0.8"
bincode = "1"
thiserror = { version = "2", default-features = false }
miette = { version = "7", features = ["fancy"] }
anyhow = "1"
tracing = "0.1"
notify = "6"
rand = "0.8"
strum = { version = "0.26", default-features = false, features = ["derive"] }
strum_macros = "0.26"
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }
