[workspace]
resolver = "2"
members = [
    "crates/pokered-web",
    "crates/pokered-runner-web",
    "crates/pokered-debug-server",
    "crates/pokered-android",
    "crates/pokered-ios",
    "crates/scene_apply",
    "crates/pokered-layout-preview",
    "crates/pokered-core",
    "crates/pokered-data",
    "crates/pokered-renderer",
    "crates/pokered-ui",
    "crates/pokered-audio",
    "crates/pokered-app",
    "crates/pokered-ui-preview",
    "crates/pokered-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
bincode = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
anyhow = "1"
tracing = "0.1"
notify = "6"
rand = "0.8"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
num-derive = "0.4"
num-traits = "0.2"
