# Local-engine override for the fidelity-audit branch: the NPC movement /
# repel fixes live in the dotzuki-2 worktree until the next tagged release.
# Remove when the workspace deps move to the new tag.
[patch."https://github.com/liuyanghejerry/dotzuki"]
dotzuki-engine = { path = "../dotzuki-2/workspace/crates/dotzuki-engine" }
dotzuki-engine-dsl = { path = "../dotzuki-2/workspace/crates/dotzuki-engine-dsl" }
dotzuki-engine-script = { path = "../dotzuki-2/workspace/crates/dotzuki-engine-script" }
dotzuki-renderer = { path = "../dotzuki-2/workspace/crates/dotzuki-renderer" }
dotzuki-rules = { path = "../dotzuki-2/workspace/crates/dotzuki-rules" }
dotzuki-app = { path = "../dotzuki-2/workspace/crates/dotzuki-app" }
dotzuki-audio = { path = "../dotzuki-2/workspace/crates/dotzuki-audio" }
dotzuki-tui = { path = "../dotzuki-2/workspace/crates/dotzuki-tui" }
dotzuki-ui = { path = "../dotzuki-2/workspace/crates/dotzuki-ui" }

[workspace]
resolver = "2"
members = [
    "crates/pokered-web",
    "crates/pokered-runner-web",
    "crates/pokered-debug-server",
    "crates/pokered-android",
    "crates/pokered-ios",
    "crates/scene_apply",
    "crates/pokered-layout-preview",
    "crates/pokered-core",
    "crates/pokered-data",
    "crates/pokered-renderer",
    "crates/pokered-ui",
    "crates/pokered-audio",
    "crates/pokered-app",
    "crates/pokered-ui-preview",
    "crates/pokered-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
bincode = "1"
thiserror = "2"
miette = { version = "7", features = ["fancy"] }
anyhow = "1"
tracing = "0.1"
notify = "6"
rand = "0.8"
strum = { version = "0.26", features = ["derive"] }
strum_macros = "0.26"
num-derive = "0.4"
num-traits = "0.2"
