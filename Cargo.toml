[workspace]
resolver = "2"
# pokered-gba is built standalone (own .cargo/config.toml, thumbv4t-none-eabi,
# own profiles) — see crates/pokered-gba/build.sh. Its dotzuki dependencies are
# pinned to the upstream GBA/no_std feature commit; vendor/ only carries ron.
exclude = ["crates/pokered-gba", "vendor"]
members = [
    "crates/pokered-platform",
    "crates/pokered-mobile",
    "crates/pokered-web",
    "crates/pokered-runner-web",
    "crates/pokered-debug-server",
    "crates/pokered-agent",
    "crates/scene_apply",
    "crates/pokered-layout-preview",
    "crates/pokered-core",
    "crates/pokered-data",
    "crates/pokered-renderer",
    "crates/pokered-ui",
    "crates/pokered-audio",
    "crates/pokered-app",
    "crates/pokered-ui-preview",
    "crates/pokered-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# no_std-friendly defaults: std-dependent features are opt-in so the GBA
# (thumbv4t-none-eabi) build of the game crates can share these definitions.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
ron = "0.8"
bincode = "1"
thiserror = { version = "2", default-features = false }
miette = { version = "7", features = ["fancy"] }
anyhow = "1"
tracing = "0.1"
notify = "6"
rand = { version = "0.8", features = ["serde1"] }
strum = { version = "0.26", default-features = false, features = ["derive"] }
strum_macros = "0.26"
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }

# NOTE (agent environment / M5): all dotzuki engine crates are pinned to the
# branch `feat/agent-serde` (instead of upstream's rev
# 55b90736aa9c2cc56e69a247b57e320c57136898) in each crate's Cargo.toml. The
# branch is that rev + serde-only additions the agent snapshot needs
# (interpreter, trigger manager, NPC runtime state, cutscene manager,
# connection transition, presentation states, CommandResult). Pin back to a
# release tag/rev once it includes those derives.
